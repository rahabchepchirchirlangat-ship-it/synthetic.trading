<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DTrader | Deriv Clone Project</title>
    <link rel="stylesheet" href="style.css">
    <!-- Chart.js for real-time tick streaming asset indicators -->
    <script src="https://jsdelivr.net"></script>
</head>
<body>

    <!-- Deriv Workspace Navigation Topbar Layout -->
    <nav class="deriv-navbar">
        <div class="nav-left">
            <div class="deriv-logo">deriv<span class="app-tag">DTrader</span></div>
            <div class="asset-selector-dropdown" onclick="toggleAssetMenu()">
                <span id="currentAssetDisplay">Volatility 100 (1s) Index</span>
                <span class="dropdown-arrow">▼</span>
                <!-- Hidden Dropdown Selection Panel Box -->
                <div id="assetDropdownMenu" class="asset-dropdown-content">
                    <div class="dropdown-item" onclick="changeDerivAsset('v100')">Volatility 100 (1s) Index</div>
                    <div class="dropdown-item" onclick="changeDerivAsset('v75')">Volatility 75 Index</div>
                    <div class="dropdown-item" onclick="changeDerivAsset('bear')">Bear Market Index</div>
                </div>
            </div>
            <div class="live-spot-badge">
                <span class="spot-label">Spot Price:</span>
                <span id="navSpotPrice" class="spot-value">0.00</span>
            </div>
        </div>
        <div class="nav-right">
            <div class="account-badge">
                <span class="badge-type">Demo</span>
                <span id="walletBalance" class="balance-amount">$10,000.00 USD</span>
            </div>
        </div>
    </nav>

    <!-- Main Workspace Setup -->
    <main class="trading-workspace">
        
        <!-- Left Area: Real-Time Stream Tick Graphics Visualizer -->
        <section class="chart-canvas-area">
            <div class="chart-metadata">
                <h2 id="chartAssetTitle">Volatility 100 (1s) Index</h2>
                <div class="tick-change-stats">
                    <span id="priceTickChange" class="neutral">0.00 (0.00%)</span>
                </div>
            </div>
            <div class="canvas-wrapper">
                <canvas id="derivTickChart"></canvas>
            </div>
        </section>

        <!-- Right Side: DTrader Standard Execution Order Panel -->
        <section class="deriv-execution-panel">
            <div class="panel-section">
                <label class="input-label">Trade Type</label>
                <div class="trade-type-display">Rise / Fall</div>
            </div>

            <!-- Duration Configuration Fields -->
            <div class="panel-section">
                <label class="input-label">Duration</label>
                <div class="duration-toggle-group">
                    <button class="tab-btn active" id="btnTicks" onclick="setDurationMode('Ticks')">Ticks</button>
                    <button class="tab-btn" id="btnMinutes" onclick="setDurationMode('Minutes')">Minutes</button>
                </div>
                <div class="input-incrementer-box">
                    <button onclick="adjustValue('durationValue', -1)">-</button>
                    <input type="number" id="durationValue" value="5" readonly>
                    <span id="durationUnitLabel" class="input-unit">Ticks</span>
                    <button onclick="adjustValue('durationValue', 1)">+</button>
                </div>
            </div>

            <!-- Stake Risk Asset Controls -->
            <div class="panel-section">
                <label class="input-label">Stake Amount</label>
                <div class="input-incrementer-box">
                    <button onclick="adjustValue('stakeValue', -10)">-</button>
                    <input type="number" id="stakeValue" value="10" step="10">
                    <span class="input-unit">USD</span>
                    <button onclick="adjustValue('stakeValue', 10)">+</button>
                </div>
            </div>

            <!-- Deriv Standard Rise and Fall Deal Action Buttons -->
            <div class="execution-actions-wrapper">
                <button class="deriv-btn-rise" onclick="submitDerivContract('RISE')">
                    <div class="btn-top-info">▲ Rise</div>
                    <div class="btn-payout-info">Payout: +95.4%</div>
                </button>
                <button class="deriv-btn-fall" onclick="submitDerivContract('FALL')">
                    <div class="btn-top-info">▼ Fall</div>
                    <div class="btn-payout-info">Payout: +95.4%</div>
                </button>
            </div>

            <!-- Statement Activity Order History Log Box Panel -->
            <div class="statement-log-panel">
                <h4>Recent Positions Log</h4>
                <div id="positionsHistoryLog" class="positions-empty-text">No active contract agreements deployed...</div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
